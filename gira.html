<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gira e scopri cosa cucinare stasera!</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #f8fbfc, #e8f5f7);
    color: #073b70;
    text-align: center;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 25px 15px 45px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    color: #16889b;
    font-size: 15px;
    margin-bottom: 25px;
}

h1 {
    font-size: 38px;
    line-height: 1.05;
    margin: 10px 0;
    font-style: italic;
}

.intro {
    font-size: 18px;
    margin-bottom: 20px;
}

.wheel-box {
    position: relative;
    width: min(92vw, 500px);
    height: min(92vw, 500px);
    margin: 20px auto;
}

#wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 12px solid white;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    transition: transform 5s cubic-bezier(0.15, 0.85, 0.2, 1);
}

.pointer {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 48px solid #073b70;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.25));
}

.spin-button {
    border: none;
    background: #073b70;
    color: white;
    font-size: 25px;
    font-weight: bold;
    padding: 16px 45px;
    border-radius: 50px;
    box-shadow: 0 5px 12px rgba(0,0,0,.2);
    cursor: pointer;
}

.spin-button:active {
    transform: scale(.96);
}

.result {
    display: none;
    background: white;
    border-radius: 25px;
    padding: 25px 20px;
    margin: 30px auto 0;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
    border: 2px solid #d5eef2;
}

.result.show {
    display: block;
}

.result h2 {
    color: #e35c4b;
    font-size: 30px;
    margin: 5px 0 10px;
}

.result h3 {
    color: #16889b;
    font-size: 21px;
    margin: 10px 0;
}

.result p {
    font-size: 17px;
    line-height: 1.5;
}

.recipe-button {
    display: inline-block;
    margin-top: 12px;
    background: #16889b;
    color: white;
    text-decoration: none;
    padding: 13px 25px;
    border-radius: 30px;
    font-weight: bold;
}

.footer {
    margin-top: 40px;
    padding: 25px 10px;
    background: #073b70;
    color: white;
    border-radius: 25px;
}

.footer strong {
    font-size: 21px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🐟 PESCHERIA da Kevin di Biase</div>
    <div class="subtitle">Il meglio del mare, ogni giorno per te! 🌊</div>

    <h1>🎡 GIRA E SCOPRI<br>
    COSA CUCINARE STASERA!</h1>

    <p class="intro">
        Non sai cosa preparare?<br>
        <strong>Lascia scegliere al mare! 🌊</strong>
    </p>

    <div class="wheel-box">
        <div class="pointer"></div>

        <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <button class="spin-button" onclick="spin()">
        🎯 GIRA!
    </button>

    <div class="result" id="result">
        <div style="font-size:45px" id="emoji"></div>

        <h2 id="fish"></h2>

        <h3 id="dish"></h3>

        <p id="description"></p>

        <p>
            ⏱️ <strong id="time"></strong>
        </p>

        <a class="recipe-button" href="ricette.html">
            👨‍🍳 SCOPRI LE RICETTE
        </a>
    </div>

    <div class="footer">
        <strong>Pescheria da Kevin di Biase</strong>
        <br><br>
        Pesce fresco, idee semplici e gustose 🐟
        <br>
        ❤️ Il mare in tavola, ogni giorno!
    </div>

</div>

<script>

const items = [
    {
        name: "Gamberoni rossi",
        emoji: "🦐",
        dish: "Gamberoni al pesto e limone",
        description: "Un piatto profumato e gustoso, perfetto per una cena speciale.",
        time: "20 minuti"
    },
    {
        name: "Orata",
        emoji: "🐟",
        dish: "Orata al forno con patate e limone",
        description: "Semplice, leggera e perfetta per tutta la famiglia.",
        time: "35 minuti"
    },
    {
        name: "Branzino",
        emoji: "🐟",
        dish: "Branzino al forno agli aromi",
        description: "Un grande classico del mare, facile e profumato.",
        time: "30 minuti"
    },
    {
        name: "Polpo",
        emoji: "🐙",
        dish: "Polpo croccante con patate",
        description: "Morbido dentro e croccante fuori, per una cena sfiziosa.",
        time: "40 minuti"
    },
    {
        name: "Calamari",
        emoji: "🦑",
        dish: "Calamari alla griglia",
        description: "Leggeri, veloci e irresistibili con limone e prezzemolo.",
        time: "15 minuti"
    },
    {
        name: "Salmone",
        emoji: "🐟",
        dish: "Salmone al limone e aromi",
        description: "Un secondo semplice e saporito.",
        time: "20 minuti"
    },
    {
        name: "Ricciola",
        emoji: "🐟",
        dish: "Ricciola in padella al limone",
        description: "Un piatto elegante con pochissimi ingredienti.",
        time: "20 minuti"
    },
    {
        name: "Dentice",
        emoji: "🐟",
        dish: "Dentice al forno mediterraneo",
        description: "Pomodorini, olive e profumi mediterranei.",
        time: "35 minuti"
    },
    {
        name: "Cozze",
        emoji: "🦪",
        dish: "Cozze alla marinara",
        description: "Un grande classico pronto in pochissimo tempo.",
        time: "15 minuti"
    },
    {
        name: "Seppie",
        emoji: "🦑",
        dish: "Seppie in umido",
        description: "Morbide e saporite, perfette con una fetta di pane.",
        time: "35 minuti"
    },
    {
        name: "Tonno",
        emoji: "🐟",
        dish: "Tonno scottato al sesamo",
        description: "Un'idea moderna e veloce per una cena speciale.",
        time: "10 minuti"
    },
    {
        name: "Misto di crostacei",
        emoji: "🦐",
        dish: "Spaghettone ai crostacei",
        description: "Tutto il profumo del mare in un unico piatto.",
        time: "30 minuti"
    }
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let rotation = 0;
let spinning = false;

function drawWheel() {

    const center = 250;
    const radius = 238;
    const slice = (2 * Math.PI) / items.length;

    const colors = [
        "#073b70",
        "#16889b",
        "#e56a55",
        "#0b7189",
        "#e5ad35",
        "#19558d"
    ];

    ctx.clearRect(0,0,500,500);

    items.forEach((item, i) => {

        const start = i * slice - Math.PI / 2;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, start, end);
        ctx.closePath();

        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();

        ctx.translate(center, center);
        ctx.rotate(start + slice / 2);

        ctx.textAlign = "right";
        ctx.fillStyle = "white";
        ctx.font = "bold 17px Arial";

        ctx.fillText(item.emoji + " " + item.name, radius - 15, 5);

        ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(center, center, 48, 0, 2*Math.PI);
    ctx.fillStyle = "#f5f5f5";
    ctx.fill();
    ctx.strokeStyle = "#073b70";
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.font = "28px Arial";
    ctx.textAlign = "center";
    ctx.fillStyle = "#073b70";
    ctx.fillText("⚓", center, center + 10);
}

drawWheel();

function spin() {

    if (spinning) return;

    spinning = true;

    document.getElementById("result").classList.remove("show");

    const selected = Math.floor(Math.random() * items.length);

    const slice = 360 / items.length;

    const targetAngle =
        360 * 6 +
        (360 - (selected * slice + slice / 2));

    rotation += targetAngle;

    canvas.style.transform =
        "rotate(" + rotation + "deg)";

    setTimeout(() => {

        const item = items[selected];

        document.getElementById("emoji").textContent = item.emoji;
        document.getElementById("fish").textContent =
            "STASERA SI CUCINA " + item.name.toUpperCase() + "!";

        document.getElementById("dish").textContent =
            item.dish;

        document.getElementById("description").textContent =
            item.description;

        document.getElementById("time").textContent =
            item.time;

        document.getElementById("result").classList.add("show");

        spinning = false;

    }, 5200);
}

</script>

</body>
</html>
