<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le nostre ricette - Pescheria da Kevin di Biase</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f7f5ef;
  font-family:Arial,Helvetica,sans-serif;
  color:#123f68;
}
.wrap{
  max-width:900px;
  margin:0 auto;
  padding:18px 14px 35px;
}
.top{
  text-align:center;
  padding:8px 0 18px;
}
.top h1{
  margin:0;
  font-size:30px;
  font-weight:800;
  letter-spacing:.5px;
}
.top p{
  margin:7px 0 0;
  color:#25849b;
  font-size:17px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}
.card{
  display:block;
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(18,63,104,.13);
  border:2px solid #dcecf0;
  transition:transform .15s ease;
}
.card:active{transform:scale(.985)}
.card img{
  display:block;
  width:100%;
  height:auto;
}
.back{
  display:block;
  width:max-content;
  margin:24px auto 0;
  padding:11px 18px;
  border-radius:999px;
  background:#123f68;
  color:white;
  text-decoration:none;
  font-weight:700;
}
@media(max-width:600px){
  .wrap{padding:12px 10px 28px}
  .top h1{font-size:25px}
  .top p{font-size:15px}
  .grid{grid-template-columns:1fr;gap:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🐟 Le nostre ricette</h1>
    <p>Pescheria da Kevin di Biase</p>
  </div>

  <div class="grid">
    <a class="card" href="branzino-menu.html"><img src="branzino.jpg" alt="Ricetta branzino"></a>
    <a class="card" href="calamari-menu.html"><img src="calamari.jpg" alt="Ricetta calamari"></a>
    <a class="card" href="cozze-menu.html"><img src="cozze.jpg" alt="Ricetta cozze"></a>
    <a class="card" href="dentice-menu.html"><img src="dentice.jpg" alt="Ricetta dentice"></a>
    <a class="card" href="gamberoni-menu.html"><img src="gamberoni.jpg" alt="Ricetta gamberoni"></a>
    <a class="card" href="orata-menu.html"><img src="orata.jpg" alt="Ricetta orata"></a>
    <a class="card" href="polpo-menu.html"><img src="polpo.jpg" alt="Ricetta polpo"></a>
    <a class="card" href="ricciola-menu.html"><img src="ricciola.jpg" alt="Ricetta ricciola"></a>
    <a class="card" href="salmone-menu.html"><img src="salmone.jpg" alt="Ricetta salmone"></a>
    <a class="card" href="seppie-menu.html"><img src="seppie.jpg" alt="Ricetta seppie"></a>
  </div>

  <a class="back" href="index.html">← TORNA AL MENU</a>
</div>
</body>
</html>
